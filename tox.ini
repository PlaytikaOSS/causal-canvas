[tox]
envlist = test, test-uv
isolated_build = true

[testenv]
skip_install = true
allowlist_externals = poetry

[testenv:test]
basepython = python3.10
commands =
    poetry install -v --no-root
    poetry run pytest tests/ --cov=causal_canvas --cov-report=xml:coverage.xml --junitxml=reports/unit_integration.xml

[testenv:lint]
basepython = python3.10
deps =
    pre-commit
commands =
    poetry install -v --no-root
    pre-commit run --all-files

[testenv:test-uv]
# Parity copy of [testenv:test] running under uv instead of poetry.
#
# uv resolves fresh from [project].dependencies (no poetry.lock). The old
# `setuptools<70` workaround (causalnex -> pgmpy<0.1.20 -> pkg_resources) is
# gone with causalnex (ADR-0001); pyyaml is now a declared dependency.
basepython = python3.10
allowlist_externals =
    pip
    uv
commands =
    pip install uv
    uv pip install -e ".[dowhy]" pytest
    pytest tests/ --cov=causal_canvas --cov-report=xml:coverage-uv.xml --junitxml=reports/unit_integration_uv.xml

[testenv:audit]
# Supply-chain vulnerability scan. Non-blocking (`-` prefix on the final
# command makes tox ignore non-zero exits) because the current
# dependency surface has a backlog of known CVEs blocked on external
# upgrades — see docs/SECURITY_AUDIT.md. Run locally with `tox -e audit`.
#
# pip-audit is installed at the tox-env level (via `deps`), NOT added
# to [tool.poetry.group.dev.dependencies]. This keeps pip-audit's
# transitive tree (requests → certifi MPL-2.0, etc.) out of
# poetry.lock so the project's distribution surface stays clean under
# Playtika's license policy.
basepython = python3.10
deps =
    pip-audit
allowlist_externals =
    poetry
    pip-audit
commands =
    poetry install -v --no-root
    - pip-audit --desc
